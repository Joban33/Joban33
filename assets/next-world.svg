<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" shape-rendering="crispEdges"><style>.p{font-family:Courier New,monospace;font-weight:900}.star{animation:twinkle 1.6s steps(2,end) infinite}.star2{animation:twinkle 2.2s steps(2,end) infinite}.signal{animation:pulse 1.8s ease-in-out infinite}@keyframes twinkle{50%{opacity:.2}}@keyframes pulse{50%{opacity:.35}}</style><rect width="1200" height="360" fill="#0b0d12"/><g fill="#f4f0e6" class="star"><rect x="90" y="55" width="6" height="6"/><rect x="210" y="105" width="8" height="8"/><rect x="450" y="48" width="6" height="6"/><rect x="760" y="90" width="7" height="7"/><rect x="1030" y="50" width="8" height="8"/></g><g fill="#e08b3e" class="star2"><rect x="330" y="82" width="8" height="8"/><rect x="630" y="54" width="6" height="6"/><rect x="920" y="112" width="8" height="8"/></g><path d="M0 285H1200" stroke="#e08b3e" stroke-width="4"/><path d="M0 310L120 280 230 300 360 255 480 290 610 225 750 286 900 250 1040 300 1200 235V360H0Z" fill="#151c26"/><path d="M0 330L150 305 300 335 460 280 620 325 790 270 960 325 1200 275V360H0Z" fill="#10151e"/><g class="p"><text x="60" y="55" font-size="18" fill="#e08b3e">HORIZON // WHAT'S NEXT</text><text x="60" y="130" font-size="40" fill="#f4f0e6">THE NEXT WORLD IS STILL LOADING.</text><text x="60" y="174" font-size="18" fill="#aab7c7">BETTER FUNDAMENTALS. BETTER BUILDS. BETTER EXECUTION.</text><text x="60" y="220" font-size="16" fill="#7f8ca3">THE GOAL ISN'T TO LOOK LIKE A GREAT BUILDER. IT'S TO BECOME ONE.</text></g><g class="signal" fill="#e08b3e"><rect x="1040" y="150" width="8" height="120"/><rect x="1050" y="142" width="42" height="8"/><rect x="1092" y="150" width="8" height="24"/></g><text class="p" x="60" y="340" font-size="14" fill="#7f8ca3">PLAYER 01 // JOURNEY CONTINUES</text></svg>