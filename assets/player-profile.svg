  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".75"/></filter>
</defs>
<rect width="1200" height="620" rx="8" fill="url(#bg)" stroke="#303846" stroke-width="2"/>
<rect x="24" y="24" width="1152" height="572" rx="4" fill="none" stroke="#1e2632"/>
