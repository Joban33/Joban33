<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Joban's player profile</title>
<desc id="desc">A game-inspired profile panel featuring Joban's original pixel character in the center, role and focus on the left, and player stats on the right.</desc>
<defs>
