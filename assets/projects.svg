<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Animated selected projects showcase">
<defs>
 <linearGradient id="g1"><stop stop-color="#00f5ff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
 <linearGradient id="g2"><stop stop-color="#ff2d75"/><stop offset="1" stop-color="#ff8a00"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
 </defs>
 <rect width="1200" height="430" rx="28" fill="#07070a"/>
 <rect width="1200" height="430" rx="28" fill="url(#grid)"/>
 <text x="55" y="55" fill="#777783" font-family="monospace" font-size="12" letter-spacing="4">SELECTED WORK / 02</text>
 <text x="55" y="95" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="800">BUILT, NOT JUST DESCRIBED.</text>
 <g transform="translate(55 130)">
  <rect width="520" height="245" rx="20" fill="#0b0b10" stroke="#00f5ff" stroke-opacity=".22"/>
  <circle cx="38" cy="38" r="5" fill="#00f5ff" filter="url(#glow)"><animate attributeName="r" values="4;8;4" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="62" y="43" fill="#00f5ff" font-family="monospace" font-size="11" letter-spacing="3">PROJECT_01 / WEB TOOL</text>
  <text x="35" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="800">IMAGE CONVERTER</text>
  <text x="35" y="124" fill="#9696a0" font-family="monospace" font-size="12">JPEG  •  PNG  •  WEBP  •  DRAG &amp; DROP</text>
  <rect x="35" y="151" width="450" height="1" fill="#fff" opacity=".08"/>
  <text x="35" y="181" fill="#777783" font-family="monospace" font-size="11">LOCAL-FIRST PROCESSING</text>
  <text x="35" y="204" fill="#00f5ff" font-family="monospace" font-size="11">NO SERVER UPLOADS</text>
  <path d="M390 197h80" stroke="url(#g1)" stroke-width="2"><animate attributeName="x1" values="390;330;390" dur="3s" repeatCount="indefinite"/><animate attributeName="x2" values="470;410;470" dur="3s" repeatCount="indefinite"/></path>
 </g>
 <g transform="translate(625 130)">
  <rect width="520" height="245" rx="20" fill="#0b0b10" stroke="#ff2d75" stroke-opacity=".22"/>
  <circle cx="38" cy="38" r="5" fill="#ff2d75" filter="url(#glow)"><animate attributeName="r" values="4;8;4" dur="2.1s" repeatCount="indefinite"/></circle>
  <text x="62" y="43" fill="#ff2d75" font-family="monospace" font-size="11" letter-spacing="3">PROJECT_02 / EXPERIENCE</text>
  <text x="35" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="800">BLACKSIGNAL</text>
  <text x="35" y="124" fill="#9696a0" font-family="monospace" font-size="12">REACT  •  TYPESCRIPT  •  GSAP  •  LENIS</text>
  <rect x="35" y="151" width="450" height="1" fill="#fff" opacity=".08"/>
  <text x="35" y="181" fill="#777783" font-family="monospace" font-size="11">SCROLL-DRIVEN CINEMATIC UI</text>
  <text x="35" y="204" fill="#ff2d75" font-family="monospace" font-size="11">MOTION AS INTERFACE</text>
  <path d="M390 197h80" stroke="url(#g2)" stroke-width="2"><animate attributeName="x1" values="390;330;390" dur="2.5s" repeatCount="indefinite"/><animate attributeName="x2" values="470;410;470" dur="2.5s" repeatCount="indefinite"/></path>
 </g>
 <text x="600" y="412" text-anchor="middle" fill="#555560" font-family="monospace" font-size="10" letter-spacing="3">MORE BUILDS LOADING / SIGNAL ACQUISITION IN PROGRESS</text>
 <rect x="55" y="407" width="1090" height="2" rx="1" fill="#fff" opacity=".05"><animate attributeName="width" values="50;1090;50" dur="5s" repeatCount="indefinite"/></rect>
</svg>