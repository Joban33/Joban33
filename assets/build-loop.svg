<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Animated terminal build loop">
<defs><linearGradient id="x"><stop stop-color="#00f5ff"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#ff2d75"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="260" rx="24" fill="#060608"/><rect x="25" y="25" width="1150" height="210" rx="18" fill="#0a0a0e" stroke="#fff" stroke-opacity=".09"/>
<circle cx="55" cy="55" r="6" fill="#ff2d75"/><circle cx="78" cy="55" r="6" fill="#ffb000"/><circle cx="101" cy="55" r="6" fill="#00d98b"/>
<text x="140" y="59" fill="#555560" font-family="monospace" font-size="11">joban@build-system ~ /profile</text>
<g font-family="monospace" font-size="13">
 <text x="55" y="100" fill="#00f5ff">$</text><text x="75" y="100" fill="#fff"> initializing creative_mode...</text>
 <text x="55" y="130" fill="#7c3aed">$</text><text x="75" y="130" fill="#fff"> loading projects</text><text x="245" y="130" fill="#666672">[</text><text x="255" y="130" fill="#00f5ff">████████████████████</text><text x="405" y="130" fill="#666672">] 100%</text>
 <text x="55" y="160" fill="#ff2d75">$</text><text x="75" y="160" fill="#fff"> motion_engine --run</text>
 <text x="55" y="190" fill="#00d98b">✓</text><text x="75" y="190" fill="#fff"> portfolio signal online</text>
 <rect x="75" y="208" width="10" height="2" fill="url(#x)"><animate attributeName="x" values="75;570;75" dur="3s" repeatCount="indefinite"/></rect>
 <text x="570" y="190" fill="#555560">cursor://active</text><rect x="570" y="197" width="7" height="15" fill="#fff" opacity=".8"><animate attributeName="opacity" values=".8;0;.8" dur=".8s" repeatCount="indefinite"/></rect>
</g>
<path d="M940 105h160M940 135h120M940 165h145" stroke="url(#x)" stroke-width="2" opacity=".45"><animate attributeName="stroke-dasharray" values="0 400;250 150;0 400" dur="4s" repeatCount="indefinite"/></path>
</svg>