<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Joban33 | Pixel World</title>
<style>
html,body{margin:0;height:100%;background:#07141a;overflow:hidden;font-family:monospace;color:#dff7d5}body{display:grid;place-items:center}.wrap{width:min(100vw,1200px);padding:12px;box-sizing:border-box}.hud{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 8px;padding:8px 10px;border:3px solid #9bdd6d;background:#102a2d;box-shadow:6px 6px 0 #041015;text-transform:uppercase;font-size:12px;letter-spacing:1px}.hud span{color:#b6f08d}.screen{position:relative;border:4px solid #b6f08d;box-shadow:8px 8px 0 #041015;background:#091c22;aspect-ratio:16/9;max-height:82vh}.hint{position:absolute;left:12px;bottom:10px;background:#0a2024cc;border:2px solid #79b960;padding:7px 9px;font-size:11px;z-index:4}.tag{position:absolute;right:12px;top:10px;background:#091a20dd;border:2px solid #79b960;padding:7px 9px;font-size:11px;z-index:4}.pixel{image-rendering:pixelated;image-rendering:crisp-edges}canvas{width:100%;height:100%;display:block;background:#06202a}.flash{animation:flash .12s steps(2) 2}@keyframes flash{50%{filter:brightness(1.8)}}
</style>
</head>
<body>
<div class="wrap"><div class="hud"><div>JOBAN33 // PIXEL WORLD</div><div>HP <span id="hp">♥♥♥</span> · XP <span id="xp">000</span> · <span id="status">EXPLORING</span></div></div><div class="screen" id="screen"><canvas id="game" width="320" height="180" class="pixel"></canvas><div class="tag">8-BIT PORTFOLIO QUEST</div><div class="hint">MOVE: WASD / ARROWS · ENTER: INTERACT · E: OPEN</div></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;x.imageSmoothingEnabled=false;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const px=2;const world={w:640,h:360};let cam={x:0,y:0};let player={x:100,y:270,dir:1,frame:0,speed:1.7};
const objects=[
{x:90,y:90,w:55,h:42,type:'home',title:'BASE CAMP',desc:'Home base: AI / ML, software, web.'},
{x:255,y:80,w:62,h:45,type:'code',title:'CODE CAVE',desc:'Python, C++, JavaScript, React, Next.js.'},
{x:435,y:92,w:66,h:45,type:'projects',title:'PROJECT FOREST',desc:'Image Converter, BlackSignal and more builds.'},
{x:160,y:220,w:62,h:48,type:'skill',title:'SKILL SHOP',desc:'Learning by building, breaking, rebuilding, shipping.'},
{x:365,y:220,w:65,h:48,type:'contact',title:'SIGNAL TOWER',desc:'Reach Joban33 on GitHub.'},
];
function rect(px,py,w,h,col){x.fillStyle=col;x.fillRect(Math.round(px),Math.round(py),w,h)}
function text(t,px,py,size=7,col='#dff7d5',align='left'){x.fillStyle=col;x.font=size+'px monospace';x.textAlign=align;x.fillText(t,px,py)}
function drawPlayer(){const p={x:player.x-cam.x,y:player.y-cam.y};rect(p.x-4,p.y-10,8,8,'#a6df75');rect(p.x-6,p.y-2,12,11,'#d8f3c0');rect(p.x-8,p.y+9,5,7,'#79b960');rect(p.x+3,p.y+9,5,7,'#79b960');rect(p.x-7,p.y-7,4,3,'#07141a');rect(p.x+4,p.y-7,3,3,'#07141a');if(Math.floor(Date.now()/180)%2===0)rect(p.x+player.dir*6,p.y,3,2,'#d9f2b9')}
function drawTree(sx,sy){rect(sx,sy,12,17,'#5b983f');rect(sx+3,sy-6,6,8,'#8fd264');rect(sx+1,sy-3,10,8,'#7fbd59');rect(sx+4,sy+17,4,6,'#855e3e')}
function drawObj(o){const sx=o.x-cam.x,sy=o.y-cam.y;const glow=Math.sin(Date.now()/400)*1.5+1.5;rect(sx+3,sy+o.h-4,o.w-6,4,'#00000055');if(o.type==='home'){rect(sx,sy+12,o.w,o.h-12,'#638d62');rect(sx+8,sy,o.w-16,18,'#9fdb73');rect(sx+19,sy+22,18,20,'#2a5149');text('HQ',sx+o.w/2,sy+12,7,'#112320','center')}else if(o.type==='code'){rect(sx,sy+8,o.w,o.h-8,'#3d7f86');rect(sx+8,sy,o.w-16,12,'#b7ec8b');rect(sx+12,sy+3,o.w-24,6,'#173338');text('</>',sx+o.w/2,sy+33,8,'#dff7d5','center')}else if(o.type==='projects'){rect(sx,sy+8,o.w,o.h-8,'#4c7a55');rect(sx+5,sy-2,o.w-10,14,'#90d068');rect(sx+11,sy+12,o.w-22,17,'#172f34');rect(sx+15,sy+16,8,7,'#9bdd6d');rect(sx+29,sy+16,8,7,'#dbf3b6')}else if(o.type==='skill'){rect(sx+6,sy+8,o.w-12,o.h-8,'#755e42');rect(sx+11,sy,o.w-22,13,'#d9f29d');text('XP',sx+o.w/2,sy+29,8,'#18302f','center')}else if(o.type==='contact'){rect(sx+7,sy+5,o.w-14,o.h-5,'#4a6e55');rect(sx+12,sy,o.w-24,11,'#b7ea8d');rect(sx+24,sy+14,17,22,'#1d3d42');text('@',sx+o.w/2,sy+30,12,'#dff7d5','center')}text(o.title,sx+o.w/2,sy-8,6,'#dff7d5','center')}
function drawWorld(){x.clearRect(0,0,W,H);x.fillStyle='#06222a';x.fillRect(0,0,W,H);for(let y=0;y<world.h;y+=12)for(let xx=0;xx<world.w;xx+=12){let v=((xx/12+y/12)%2);rect(xx-cam.x, y-cam.y,12,12,v?'#0a3030':'#0b3434')}for(let i=0;i<28;i++){let tx=(i*53)%world.w,ty=(i*91)%world.h;if(!objects.some(o=>tx>o.x-10&&tx<o.x+o.w+10&&ty>o.y-18&&ty<o.y+o.h+18))drawTree(tx-cam.x,ty-cam.y)}for(const o of objects)drawObj(o);drawPlayer();}
let active=null;function interact(){active=objects.find(o=>Math.hypot(player.x-(o.x+o.w/2),player.y-(o.y+o.h/2))<48)||null;if(active){show(active)}}function show(o){document.getElementById('status').textContent=o.title;let old=document.getElementById('modal');if(old)old.remove();const m=document.createElement('div');m.id='modal';m.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(82%,420px);background:#081a1fcc;border:4px solid #b6f08d;padding:14px;box-shadow:8px 8px 0 #041015;z-index:5';m.innerHTML='<div style="color:#b6f08d;font-size:12px">'+o.title+'</div><div style="font-size:18px;margin:7px 0;color:#fff">QUEST UNLOCKED</div><div style="font-size:12px;line-height:1.5;color:#dff7d5">'+o.desc+'</div><div style="margin-top:12px;color:#79b960;font-size:10px">PRESS ENTER TO CLOSE</div>';document.getElementById('screen').appendChild(m);}
function loop(){let dx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0),dy=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);if(dx||dy){let l=Math.hypot(dx,dy)||1;player.x+=dx/l*player.speed;player.y+=dy/l*player.speed;player.dir=dx<0?-1:dx>0?1:player.dir;player.frame++}player.x=Math.max(10,Math.min(world.w-10,player.x));player.y=Math.max(30,Math.min(world.h-10,player.y));cam.x=Math.max(0,Math.min(world.w-W,player.x-W/2));cam.y=Math.max(0,Math.min(world.h-H,player.y-H/2));if(keys['enter']||keys['e']){keys['enter']=keys['e']=false; if(document.getElementById('modal'))document.getElementById('modal').remove(); else interact()}drawWorld();requestAnimationFrame(loop)}loop();
</script>
</body></html>
