<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOBAN33 // The Developer Quest</title><link rel="stylesheet" href="./game.css"></head><body><main class="crt"><section class="frame" id="frame"><canvas id="game" width="640" height="360"></canvas><div class="night" id="night"></div><div class="weather" id="rain"></div><div class="hud"><div class="panel">JOBAN <span id="hearts">♥♥♥</span><br>HP <span class="meter"><i id="hpbar"></i></span></div><div class="panel xp">XP <b id="xp">0</b><br><span class="meter"><i id="xpbar"></i></span></div><div class="panel">DAY <span id="day">01</span><br><span id="clock">DAY</span></div></div><div class="mapname" id="mapname">MEADOW OUTSKIRTS</div><div class="controls">WASD / ARROWS · E / ENTER · ESC</div><div class="toast" id="toast">+10 XP</div><div class="dialog" id="dialog"><div class="speaker" id="speaker">JOBAN</div><p id="dialogText"></p><div class="close">ENTER / E TO CLOSE</div></div><div class="pause" id="pause"><div class="panel">PAUSED<br><br>ESC TO RETURN</div></div><div class="screen" id="title"><div class="title"><div class="logo">JOBAN33</div><div class="subtitle">THE DEVELOPER QUEST<br><span style="color:#ffd75a">A PLAYABLE PORTFOLIO ADVENTURE</span></div><div class="menu"><button id="start">▶ START GAME</button><button id="load">↻ LOAD GAME</button><button id="about">★ ABOUT</button><button id="github">◆ GITHUB</button></div><div class="tiny">YEAR 2026 · JOBAN'S WORLD<br>MISSION: BUILD SOMETHING WORTH REMEMBERING</div></div></div><div class="mobile"><div class="dpad"><button class="up" data-key="arrowup">▲</button><button class="left" data-key="arrowleft">◀</button><button class="down" data-key="arrowdown">▼</button><button class="right" data-key="arrowright">▶</button></div><div class="interact"><button id="mobileE">E</button></div></div></section></main><script>
const C=document.getElementById('game'),ctx=C.getContext('2d');ctx.imageSmoothingEnabled=false;const W=640,H=360;const keys={};let running=false,paused=false,dialog=null,xp=0,day=1,t=0,weather='clear';
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='escape'){if(dialog){closeDialog()}else{paused=!paused;document.getElementById('pause').classList.toggle('show',paused)}}if((k==='e'||k==='enter')&&running&&!paused){if(dialog)closeDialog();else interact()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.key]=true;b.onpointerup=b.onpointercancel=()=>keys[b.dataset.key]=false});document.getElementById('mobileE').onclick=()=>dialog?closeDialog():interact();
const player={x:78,y:274,dir:1,frame:0,speed:1.65};const world={w:1280,h:720};let cam={x:0,y:0};
const zones=[{x:0,y:0,w:390,h:360,name:'MEADOW OUTSKIRTS'},{x:390,y:0,w:390,h:360,name:'CODE FOREST'},{x:780,y:0,w:500,h:360,name:'PROJECT CITY'},{x:0,y:360,w:430,h:360,name:'AI LAB'},{x:430,y:360,w:430,h:360,name:'SKILL MOUNTAIN'},{x:860,y:360,w:420,h:360,name:'GITHUB CASTLE'}];
const points=[
{x:110,y:210,w:82,h:58,kind:'home',name:"JOBAN'S HOUSE",text:'Welcome to Joban\'s world.\nJobanpreet Singh Gill\nB.Tech CSE | AI & ML\nBuilder / Developer / Explorer',color:'#e0a15b'},
{x:470,y:95,w:70,h:54,kind:'python',name:'PYTHON SHRINE',text:'PYTHON\nAutomation, AI/ML and experiments.',color:'#4d9dff'},
{x:590,y:185,w:68,h:54,kind:'cpp',name:'C++ FORGE',text:'C++\nSharpening fundamentals one problem at a time.',color:'#e86cff'},
{x:710,y:90,w:70,h:54,kind:'github',name:'GITHUB CHEST',text:'GITHUB\nThe public save point for the builds.',color:'#f2d05b'},
{x:830,y:120,w:96,h:68,kind:'image',name:'IMAGE CONVERTER LAB',text:'IMAGE CONVERTER\nA practical image conversion tool.\n\n[OPEN PROJECT]',color:'#47d9ff',url:'https://github.com/Joban33/Image-Converter'},
{x:1000,y:215,w:96,h:68,kind:'black',name:'BLACKSIGNAL STUDIO',text:'BLACKSIGNAL\nCinematic web experience focused on motion and storytelling.\n\n[OPEN PROJECT]',color:'#c06cff',url:'https://github.com/Joban33/hacckker'},
{x:155,y:470,w:100,h:66,kind:'lab',name:'NEURAL CORE',text:'AI / ML\nExploring intelligent systems, machine learning and practical AI.',color:'#6f7cff'},
{x:540,y:505,w:76,h:55,kind:'js',name:'JAVASCRIPT CAMP',text:'JAVASCRIPT\nThe language powering the interactive side of the world.',color:'#ffd34f'},
{x:680,y:615,w:78,h:55,kind:'react',name:'REACT PORTAL',text:'REACT / NEXT.JS\nBuilding interfaces and experiments for the web.',color:'#55e7ff'},
{x:965,y:495,w:116,h:80,kind:'castle',name:'GITHUB CASTLE',text:'QUEST COMPLETE\nYou found Joban33.\n\nAI / ML · SOFTWARE · WEB · BUILDING',color:'#f3d46a'}];
const npcs=[{x:300,y:250,name:'MIRA',color:'#ff7998',text:'Hey traveler! The Code Forest is east.\nWatch out for bugs.'},{x:750,y:270,name:'BYTE',color:'#75e7ff',text:'Joban spends a suspicious amount of time breaking things.\nApparently that is called debugging.'},{x:410,y:545,name:'NOVA',color:'#b58cff',text:'The Neural Core is unstable.\nProbably needs more training data.'},{x:890,y:575,name:'GUARD',color:'#ffd75a',text:'Only builders who finish the quest may enter the castle.'}];
const collectibles=[{x:210,y:125,id:'a',v:10},{x:530,y:280,id:'b',v:15},{x:750,y:120,id:'c',v:20},{x:925,y:85,id:'d',v:25},{x:350,y:470,id:'e',v:15},{x:610,y:430,id:'f',v:20},{x:800,y:650,id:'g',v:30},{x:1120,y:430,id:'h',v:25}];let got=JSON.parse(localStorage.getItem('joban_collect')||'[]');
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.floor(x),Math.floor(y),w,h)}function text(s,x,y,size=8,c='#fff3cc',align='left'){ctx.font=size+'px monospace';ctx.textAlign=align;ctx.fillStyle=c;ctx.fillText(s,x,y)}function zoneAt(x,y){return zones.find(z=>x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h)||zones[0]}
function drawTile(x,y,c1,c2){rect(x,y,16,16,c1);rect(x+2,y+2,3,3,c2);rect(x+11,y+9,2,2,c2)}function drawWorld(){ctx.clearRect(0,0,W,H);for(let y=0;y<world.h;y+=16)for(let x=0;x<world.w;x+=16){let z=zoneAt(x,y);let c1=z.name==='CODE FOREST'?'#2b714a':z.name==='PROJECT CITY'?'#40526d':z.name==='AI LAB'?'#263f78':z.name==='SKILL MOUNTAIN'?'#72533e':z.name==='GITHUB CASTLE'?'#4b425f':'#4c963e';let c2=z.name==='CODE FOREST'?'#55ad64':z.name==='PROJECT CITY'?'#61728c':z.name==='AI LAB'?'#486fc1':z.name==='SKILL MOUNTAIN'?'#a97955':z.name==='GITHUB CASTLE'?'#75648e':'#79b951';drawTile(x-cam.x,y-cam.y,c1,c2)}drawWater();drawDecor();for(const p of points)drawPoint(p);for(const n of npcs)drawNPC(n);for(const q of collectibles)if(!got.includes(q.id))drawCollect(q);drawPlayer()}
function drawWater(){const ox=390-cam.x,oy=300-cam.y;for(let i=0;i<15;i++)for(let j=0;j<3;j++){let xx=ox+i*16,yy=oy+j*10;rect(xx,yy,15,9,'#2c9bb5');rect(xx+((i+(Math.floor(t/20)%2))*5)%12,yy+3,5,1,'#68e7e7')}}
function drawDecor(){for(let i=0;i<75;i++){let wx=(i*97+31)%world.w,wy=(i*53+19)%world.h;let z=zoneAt(wx,wy);if(z.name==='PROJECT CITY'||z.name==='GITHUB CASTLE')continue;let sx=wx-cam.x,sy=wy-cam.y; if(sx<-20||sy<-20||sx>W+20||sy>H+20)continue;if(i%4!==0){rect(sx+5,sy+8,5,10,'#7a5139');rect(sx+1,sy+3,13,10,i%3?'#26734a':'#348c51');rect(sx+4,sy,8,8,'#4ea85b')}else{rect(sx+5,sy+6,6,8,'#e4b05d');rect(sx+2,sy+3,12,6,i%2?'#ff6576':'#ffdb67')}}for(let i=0;i<18;i++){let sx=(i*83+40-cam.x),sy=(i*117+50-cam.y)+Math.sin(t/35+i)*3;rect(sx,sy,2,2,'#ffe87a')}}
function building(x,y,w,h,wall,roof,sign){let sx=x-cam.x,sy=y-cam.y;rect(sx+3,sy+h-3,w-6,5,'#18202c');rect(sx,sy+12,w,h-12,wall);rect(sx+5,sy,w-10,18,roof);rect(sx+w/2-7,sy+h-20,14,20,'#34283b');rect(sx+10,sy+25,12,12,'#8bdcf0');rect(sx+w-22,sy+25,12,12,'#8bdcf0');rect(sx+w/2-25,sy-11,50,12,'#1b2738');text(sign,sx+w/2,sy-2,5,'#fff3cc','center');if(Math.floor(t/30)%2===0){rect(sx+12,sy+26,8,7,'#ffd65a');rect(sx+w-20,sy+26,8,7,'#ffd65a')}}
function drawPoint(p){let sx=p.x-cam.x,sy=p.y-cam.y;if(p.kind==='home')building(p.x,p.y,p.w,p.h,'#a66b4e','#e8b45d','JOBAN\'S HOUSE');else if(p.kind==='image')building(p.x,p.y,p.w,p.h,'#236b79','#4ce1ff','IMAGE LAB');else if(p.kind==='black')building(p.x,p.y,p.w,p.h,'#57366d','#bb66ff','BLACKSIGNAL');else if(p.kind==='castle'){building(p.x,p.y,p.w,p.h,'#66537e','#f0cf64','GITHUB CASTLE');rect(sx+20,sy+15,10,14,'#e8d59a');rect(sx+p.w-30,sy+15,10,14,'#e8d59a')}else if(p.kind==='lab'){building(p.x,p.y,p.w,p.h,'#324e91','#687cff','AI LAB');rect(sx+32,sy+18,36,25,'#132b61');for(let i=0;i<4;i++)rect(sx+36+i*8,sy+22,4,15,['#55e7ff','#a47dff','#65f0ad','#ffdb67'][i])}else{let c=p.color;rect(sx+8,sy+9,p.w-16,p.h-9,'#25394c');rect(sx+3,sy,p.w-6,13,c);rect(sx+18,sy+25,p.w-36,18,'#111c2a');text(p.name,sx+p.w/2,sy-8,5,'#fff3cc','center');rect(sx+p.w/2-3,sy+29,6,6,c)}if(Math.hypot(player.x-(p.x+p.w/2),player.y-(p.y+p.h/2))<55){text('E',sx+p.w/2,sy+p.h+13,8,'#ffd75a','center')}}
function drawNPC(n){let sx=n.x-cam.x,sy=n.y-cam.y, bob=Math.sin(t/12+n.x)*1.2;rect(sx-5,sy-8+bob,10,10,'#ffd3a6');rect(sx-7,sy+2+bob,14,13,n.color);rect(sx-8,sy+15+bob,5,7,'#253149');rect(sx+3,sy+15+bob,5,7,'#253149');rect(sx-6,sy-6+bob,3,3,'#162033');rect(sx+3,sy-6+bob,3,3,'#162033');if(Math.floor(t/25)%2===0)text(n.name,sx,sy-15+bob,5,'#fff3cc','center')}
function drawPlayer(){let sx=player.x-cam.x,sy=player.y-cam.y,bob=player.frame&&Math.floor(t/8)%2?2:0;rect(sx-5,sy-13+bob,10,10,'#f3c29c');rect(sx-7,sy-3+bob,14,13,'#4f86ff');rect(sx-8,sy+10+bob,6,8,'#e7b35f');rect(sx+2,sy+10+bob,6,8,'#e7b35f');rect(sx-7,sy-11+bob,14,4,'#2b2948');rect(sx-5,sy-7+bob,3,3,'#101a29');rect(sx+2,sy-7+bob,3,3,'#101a29')}
function drawCollect(q){let sx=q.x-cam.x,sy=q.y-cam.y,b=Math.sin(t/10+q.x)*3;rect(sx-4,sy-4+b,8,8,q.id<'d'?'#ffd75a':'#70eaff');rect(sx-2,sy-6+b,4,12,'#fff3a8');rect(sx-6,sy-2+b,12,4,'#fff3a8')}
function blocked(nx,ny){if(nx<12||ny<28||nx>world.w-12||ny>world.h-12)return true;for(const p of points)if(nx>p.x-10&&nx<p.x+p.w+10&&ny>p.y-10&&ny<p.y+p.h+10)return true;return false}
function interact(){let target=null,best=58;for(const p of points){let d=Math.hypot(player.x-(p.x+p.w/2),player.y-(p.y+p.h/2));if(d<best){best=d;target=p}}for(const n of npcs){let d=Math.hypot(player.x-n.x,player.y-n.y);if(d<best){best=d;target=n}}if(!target){return}if(target.url){showDialog(target.name,target.text+'\n\nPress E again to open the project.');dialog={...target};}else showDialog(target.name,target.text)}
function showDialog(s,m){document.getElementById('speaker').textContent=s;document.getElementById('dialogText').textContent=m;document.getElementById('dialog').classList.add('show');dialog=dialog||{};}
function closeDialog(){document.getElementById('dialog').classList.remove('show');if(dialog&&dialog.url&&document.activeElement){if(confirm('Open '+dialog.name+'?'))location.href=dialog.url}dialog=null}
function toast(v){const e=document.getElementById('toast');e.textContent='+'+v+' XP';e.classList.add('show');setTimeout(()=>e.classList.remove('show'),900)}
function save(){localStorage.setItem('joban_collect',JSON.stringify(got));localStorage.setItem('joban_xp',xp)}
function update(){if(!running||paused)return;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){let l=Math.hypot(dx,dy);let nx=player.x+dx/l*player.speed,ny=player.y+dy/l*player.speed;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;player.dir=dx<0?-1:dx>0?1:player.dir;player.frame++}for(const q of collectibles)if(!got.includes(q.id)&&Math.hypot(player.x-q.x,player.y-q.y)<16){got.push(q.id);xp+=q.v;toast(q.v);save()}let z=zoneAt(player.x,player.y);document.getElementById('mapname').textContent=z.name;cam.x=Math.max(0,Math.min(world.w-W,player.x-W/2));cam.y=Math.max(0,Math.min(world.h-H,player.y-H/2));document.getElementById('xp').textContent=xp;document.getElementById('xpbar').style.width=Math.min(100,xp%100)+'%';document.getElementById('clock').textContent=(Math.floor(t/1800)%2?'NIGHT':'DAY');document.getElementById('night').classList.toggle('on',Math.floor(t/1800)%2===1);document.getElementById('rain').classList.toggle('rain',weather==='rain')}
function loop(){t++;update();drawWorld();requestAnimationFrame(loop)}
document.getElementById('start').onclick=()=>{document.getElementById('title').style.display='none';running=true;localStorage.setItem('joban_started','1')};document.getElementById('load').onclick=()=>{xp=Number(localStorage.getItem('joban_xp')||0);document.getElementById('title').style.display='none';running=true};document.getElementById('about').onclick=()=>showDialog('ABOUT JOBAN','B.Tech CSE (AI & ML) student.\nLearning, experimenting, building and shipping.\nThis profile is the game.');document.getElementById('github').onclick=()=>location.href='https://github.com/Joban33';setInterval(()=>{weather=Math.random()<.25?'rain':'clear'},9000);loop();
</script></body></html>
